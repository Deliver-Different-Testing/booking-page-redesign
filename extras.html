<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extras — DFRNT booking redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.backdrop { position: fixed; inset: 0; background: rgba(13,12,44,.45); z-index: 10; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: 640px; max-width: 100vw; background: #fff; box-shadow: 0 16px 40px rgba(13,12,44,.16); display: flex; flex-direction: column; z-index: 20; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 28px 32px 16px; gap: 16px; }
.sheet-body { flex-grow: 1; overflow: auto; padding: 0 32px; display: flex; flex-direction: column; gap: 8px; }
.sheet-foot { border-top: 1px solid var(--dd-outline-variant); padding: 20px 32px 28px; display: flex; flex-direction: column; gap: 14px; }
.row { display: grid; grid-template-columns: 28px 1fr 150px 90px; gap: 14px; align-items: start; padding: 14px 12px; border-radius: 12px; border: 1px solid var(--dd-outline-variant); cursor: pointer; }
.row.on { border-color: var(--dd-primary); background: #f7f8ff; }
.row input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--dd-primary); }
.row .amt { font-size: 14px; font-weight: 700; text-align: right; }
.row:not(.on) .amt { font-weight: 400; color: var(--dd-secondary); }
.badge { font-size: 10px; font-weight: 800; letter-spacing: .04em; border-radius: 999px; padding: 3px 7px; margin-left: 8px; vertical-align: middle; }
.mini { height: 36px; border: 1px solid var(--dd-outline); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 14px; width: 72px; }
.tab { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--dd-outline); background: #fff; font-size: 13px; font-weight: 600; color: var(--dd-ink); cursor: pointer; }
.tab.on { background: var(--dd-primary-container); border-color: var(--dd-primary); color: var(--dd-primary-active); }
.ph { background: #fff; border: 1px solid var(--dd-outline-variant); border-radius: 16px; }
@media (max-width: 720px) { .row { grid-template-columns: 28px 1fr 80px; } .row .calc { display: none; } .sheet-head, .sheet-body, .sheet-foot { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark"></div><span class="brand-name">DFRNT</span><span class="brand-app">Booking</span></div><nav class="nav"><a href="index.html" class="on">Book a job</a><a href="#">Job list</a><a href="#">Settings</a></nav><a href="#" class="hublink">DFRNT Hub</a></header>
<div class="ctxbar"></div>
<main class="page"><div class="grid"><div style="display: flex; flex-direction: column; gap: 16px"><div class="ph" style="height: 300px"></div><div class="ph" style="height: 320px"></div></div><div class="ph" style="height: 640px"></div></div></main>

<div class="backdrop"></div>
<aside class="sheet" role="dialog" aria-labelledby="sheet-title">
  <div class="sheet-head">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 id="sheet-title" style="margin: 0; font-size: 22px; font-weight: 800">Extras for Urgent Today</h2>
      <span style="font-size: 13px; color: var(--dd-text-2)">Some are added automatically from the job details. Untick anything you don't need.</span>
    </div>
    <a href="index.html" aria-label="Close" class="icn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 32px 16px; flex-wrap: wrap" id="tabs"><button type="button" class="tab on">All legs</button><button type="button" class="tab">Pickup agent</button><button type="button" class="tab">Flight</button><button type="button" class="tab">Delivery agent</button></div>

  <div class="sheet-body">
    <label class="row on"><input type="checkbox" checked disabled><div><div style="font-size: 14px; font-weight: 700">Fuel adjustment<span class="badge" style="background: var(--dd-outline-variant); color: #413f47">ALWAYS</span></div><div class="hint">Applied to every job on this service. 4.2% of the base rate.</div></div><span class="hint calc" style="padding-top: 3px">4.2% of $18.50</span><span class="amt">$0.78</span></label>
    <label class="row on"><input type="checkbox" checked data-amt="6.50"><div><div style="font-size: 14px; font-weight: 700">Residential delivery<span class="badge" style="background: var(--dd-primary-container); color: var(--dd-primary-active)">AUTO</span></div><div class="hint">Added because the delivery address is a residence.</div></div><span class="hint calc" style="padding-top: 3px">Flat fee</span><span class="amt">$6.50</span></label>
    <label class="row"><input type="checkbox" data-amt="0"><div><div style="font-size: 14px; font-weight: 700">Wait time</div><div class="hint">First 10 minutes free, then per minute.</div></div><span class="calc" style="display: flex; align-items: center; gap: 6px"><input class="mini" value="0" aria-label="Minutes" disabled><span class="hint">min × $1.20</span></span><span class="amt">$0.00</span></label>
    <label class="row"><input type="checkbox" data-amt="24.00"><div><div style="font-size: 14px; font-weight: 700">Two-person lift</div><div class="hint">For items over 25 kg or awkward to carry alone.</div></div><span class="hint calc" style="padding-top: 3px">Flat fee</span><span class="amt">$24.00</span></label>
    <label class="row"><input type="checkbox" data-amt="0"><div><div style="font-size: 14px; font-weight: 700">Hazmat handling</div><div class="hint">Per package declared as dangerous goods.</div></div><span class="calc" style="display: flex; align-items: center; gap: 6px"><input class="mini" value="0" aria-label="Packages" disabled><span class="hint">pkg × $9.00</span></span><span class="amt">$0.00</span></label>
    <label class="row" style="opacity: .8; cursor: default"><input type="checkbox" disabled><div><div style="font-size: 14px; font-weight: 700">After-hours pickup</div><div class="hint">Needs a quote. Ask on live chat before booking.</div></div><span class="hint calc" style="padding-top: 3px">Quote required</span><span class="amt">—</span></label>
  </div>

  <div class="sheet-foot">
    <div class="totals" style="border: 0; padding: 0">
      <div class="l"><span>Urgent Today</span><span>$18.50</span></div>
      <div class="l"><span>Extras (<span id="n">2</span>)</span><span id="ex">$7.28</span></div>
      <div class="l"><span>GST 15%</span><span id="gst">$3.87</span></div>
      <div class="t"><span>Total</span><span id="total">$29.65</span></div>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap"><a href="index.html" class="ghost" style="height: 52px; padding: 0 20px">Back to booking</a><a href="index.html" class="cta" style="flex: 1; min-width: 160px">Done</a></div>
  </div>
</aside>

<nav class="proto" aria-label="Prototype screens"><strong>Prototype</strong><a href="gate.html">Gate</a><a href="index.html">Booking</a><a href="extras.html" class="on">Extras</a><a href="booked.html">Booked</a><a href="mobile.html">Phone</a></nav>
<script>
(function () {
  const rows = Array.from(document.querySelectorAll('.row'));
  const money = (n) => '$' + n.toFixed(2);
  const recalc = () => {
    let sum = 0.78, n = 1;
    rows.forEach((r) => { const c = r.querySelector('input[type=checkbox]'); if (c.dataset.amt !== undefined) { r.classList.toggle('on', c.checked); if (c.checked) { sum += parseFloat(c.dataset.amt); n++; } } });
    const sub = 18.5 + sum, gst = sub * 0.15;
    document.getElementById('n').textContent = n; document.getElementById('ex').textContent = money(sum);
    document.getElementById('gst').textContent = money(gst); document.getElementById('total').textContent = money(sub + gst);
  };
  rows.forEach((r) => r.querySelector('input[type=checkbox]').addEventListener('change', recalc));
  document.querySelectorAll('#tabs .tab').forEach((t) => t.addEventListener('click', () => { document.querySelectorAll('#tabs .tab').forEach((x) => x.classList.remove('on')); t.classList.add('on'); }));
})();
</script>
</body>
</html>
